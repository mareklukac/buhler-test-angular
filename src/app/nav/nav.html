@for (machine of machines(); track machine.name) {
  <a
    class="item"
    [class]="machine.state"
    [routerLink]="['/machine', machine.name.toLowerCase()]"
    routerLinkActive="active"
  >
    <span>{{ machine.name }}</span>
    <mat-icon class="state_icon" [class]="machine.state">{{
      machine.state === 'running'
        ? 'check_circle'
        : machine.state === 'warning'
          ? 'warning'
          : 'error'
    }}</mat-icon>
  </a>
}
